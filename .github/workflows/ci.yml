name: PR06 model and evidence

on:
  push:
    paths:
      - 'src/course_description/**'
      - 'evidence/pr06/**'
      - '.github/workflows/pr06.yml'
  pull_request:
    paths:
      - 'src/course_description/**'
      - 'evidence/pr06/**'
      - '.github/workflows/pr06.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:e6b1cb530b65588279681db53784e264ce5cf83f2cc33e689d27d6024d7f3ebe
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w09-8579e0afe96d.tar.gz
      COURSE_KIT_SHA256: 8579e0afe96d76220735b6019cc38b1f3cac8c21e4aae8470785138a74a6c54a
    steps:
      - name: Prepare Node for checkout
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs ca-certificates curl
          node --version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and test course_description
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select course_description
          source install/setup.bash
          xacro src/course_description/urdf/vehicle.urdf.xacro > /tmp/vehicle.urdf
          check_urdf /tmp/vehicle.urdf
          (cd src/course_description && python3 -m pytest test -q)

      - name: Download pinned course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      - name: Validate evidence
        shell: bash
        run: |
          python3 -m json.tool evidence/pr06/report.json >/dev/null
          python3 .course-kit/v1/tools/check_practice.py PR06 --submission .